name: repository-checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Record runtime
        run: |
          python3 --version
          docker --version
      - name: Check shell syntax
        run: |
          bash -n sql/run_all.sh
          bash -n scripts/linux_offline_smoke.sh
      - name: Run eight isolated SQL prototypes
        run: ./sql/run_all.sh
      - name: Set up Python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
      - name: Set up uv v7.6.0
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.7'
          enable-cache: false
      - name: Build and test installed application wheel
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/thalion-check-env
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/thalion-wheels" --no-python-downloads
          uv sync --locked --no-install-project --no-python-downloads --extra pdf
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps "$RUNNER_TEMP"/thalion-wheels/*.whl
          "$UV_PROJECT_ENVIRONMENT/bin/thalion-parse" --help
          cd "$RUNNER_TEMP"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -m pytest "$GITHUB_WORKSPACE/tests"
